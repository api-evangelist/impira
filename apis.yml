name: Impira
description: >-
  Impira was a document-AI / intelligent-document-processing company that let business
  users turn unstructured content — documents, invoices, images, PDFs and webpages —
  into structured, queryable data by building and training extraction models without
  code. Backed by Lightspeed Venture Partners, Impira was acquired by Figma in early
  2023 and its standalone product domains (impira.com, impira.io) no longer serve.
  Its GitHub organization (github.com/impira) survives, along with two first-party
  open-source Python libraries still published on PyPI: the official Impira Python SDK
  and DocQuery, an MIT-licensed document question-answering library. This profile is
  maintained in the API Evangelist network as an acquired-company record; there is no
  live API, developer portal, or hosted documentation surface remaining.
